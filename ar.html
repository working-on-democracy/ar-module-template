<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0, user-scalable=no" />
  <title>AR Module Preview (8th Wall)</title>
  <!-- Full host runtime, loaded in strict order — each appended dynamically with
       async=false to preserve that order (a normal parser-blocking <script src>
       would run before any of these, so the whole chain has to use this pattern,
       not just the locally-hosted files) while resolving every local path
       relative to THIS page at runtime, so the build (dist-ar/) still works when
       served from any subdirectory, not just the domain root — a root-absolute
       path (e.g. "/external/...") breaks in a subdir, and a relative
       <script src="external/..."> written directly in the HTML would make Vite
       try to bundle a file that only exists after vite-plugin-static-copy runs
       at build time.
         1. 8frame (8thwall's patched A-Frame) — must load first, defines AFRAME.
         2. aframe-extras — extends AFRAME, needs it already loaded.
         3. xrextras (self-hosted; 8thwall's CDN only serves an unversioned
            xrextras.js that mutates in place).
         4. the 8th Wall engine (xr.js).
       8frame + xr.js must be the matched pair that ships with
       @8thwall/engine-binary's example projects — NOT the 8frame build at
       cdn.8thwall.com/web/aframe/, which belongs to 8th Wall's classic
       commercial backend and throws "No valid session manager to handle this
       session" against this engine's session-manager protocol (confirmed by
       diffing the two files: same filename, different builds — 375KB CDN vs.
       1.4MB vendored). So 8frame is vendored here (lib/vendor/, no npm package
       exists for it) rather than pinned via package.json; xrextras and the
       engine are self-hosted — copied from @8thwall/xrextras /
       @8thwall/engine-binary into external/ by vite-plugin-static-copy (see
       vite.config.ts); aframe-extras comes from jsDelivr. -->
  <script>
    (function () {
      function load(src, attrs) {
        var s = document.createElement("script");
        s.src = /^https?:\/\//.test(src) ? src : new URL(src, document.baseURI).href;
        for (var k in attrs) s.setAttribute(k, attrs[k]);
        s.async = false;
        document.head.appendChild(s);
      }
      load("external/scripts/8frame-1.5.0.min.js");
      load("https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js");
      load("external/xrextras/xrextras.js");
      load("external/xr/xr.js", { "data-preload-chunks": "slam" });
    })();
  </script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    .preview-overlay {
      position: fixed; top: 12px; left: 12px;
      background: rgba(15, 23, 42, 0.85);
      color: white; padding: 8px 12px;
      border-radius: 8px;
      font-family: sans-serif; font-size: 13px;
      z-index: 100; pointer-events: none;
      line-height: 1.4;
    }
    .preview-overlay strong { color: #93c5fd; }
  </style>
</head>
<body>
  <div class="preview-overlay">
    <strong>AR Module Preview · 8th Wall</strong><br/>
    Grant camera access · move your device to place the scene
  </div>
  <div id="app"></div>
  <script type="module" src="/lib/preview-ar.ts"></script>
</body>
</html>
